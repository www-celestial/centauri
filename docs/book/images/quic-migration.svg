<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434">
<title>A download whose client changes address at 2 MB: the pause before the next byte, for each way to carry on</title>
<style>text{font-family:system-ui, sans-serif;font-size:12px;fill:#1f2328}.h{font-weight:600;font-size:13px}.s{fill:#57606a}.b{fill:#ebfbee;stroke:#2f9e44}.g{fill:#fff4e6;stroke:#e8590c}.r{stroke:#57606a;stroke-width:1.2}</style>
<rect width="760" height="434" fill="#fff"/>
<text class="h" x="16" y="24">The client changes address at 2 MB of 10 MB: the pause before the next byte</text>
<text class="s" x="16" y="42">median of the rounds, the line from the least to the most; migrate.sh, then python3 -I migration-svg.py</text>
<text class="h" x="16" y="68">a clean link</text>
<text x="16" y="100">QUIC, migration (quic-go both sides)</text>
<rect class="b" x="400" y="88" width="2.0" height="16" rx="2"/>
<line class="r" x1="400.1" y1="96" x2="404.4" y2="96"/>
<text x="410.4" y="100">1 ms [0, 20]</text>
<text x="16" y="130">QUIC, migration (Cesia's server on ngtcp2)</text>
<rect class="b" x="400" y="118" width="9.8" height="16" rx="2"/>
<line class="r" x1="406.9" y1="126" x2="422.5" y2="126"/>
<text x="428.5" y="130">46 ms [32, 104]</text>
<text x="16" y="160">QUIC before, a new connection (Cesia on OpenSSL)</text>
<rect class="g" x="400" y="148" width="5.1" height="16" rx="2"/>
<line class="r" x1="403.1" y1="156" x2="436.2" y2="156"/>
<text x="442.2" y="160">24 ms [15, 168]</text>
<text x="16" y="190">QUIC, a new connection and the rest (Cesia)</text>
<rect class="g" x="400" y="178" width="12.9" height="16" rx="2"/>
<line class="r" x1="409.5" y1="186" x2="630.0" y2="186"/>
<text x="636.0" y="190">60 ms [44, 1068]</text>
<text x="16" y="220">TCP, a new connection and the rest (Cesia)</text>
<rect class="g" x="400" y="208" width="6.9" height="16" rx="2"/>
<line class="r" x1="403.2" y1="216" x2="424.0" y2="216"/>
<text x="430.0" y="220">32 ms [15, 111]</text>
<text class="h" x="16" y="240">25 ms each way, 1 % lost</text>
<text x="16" y="272">QUIC, migration (quic-go both sides)</text>
<rect class="b" x="400" y="260" width="21.9" height="16" rx="2"/>
<line class="r" x1="421.7" y1="268" x2="422.4" y2="268"/>
<text x="428.4" y="272">102 ms [101, 104]</text>
<text x="16" y="302">QUIC, migration (Cesia's server on ngtcp2)</text>
<rect class="b" x="400" y="290" width="33.4" height="16" rx="2"/>
<line class="r" x1="432.8" y1="298" x2="477.8" y2="298"/>
<text x="483.8" y="302">155 ms [152, 361]</text>
<text x="16" y="332">QUIC before, a new connection (Cesia on OpenSSL)</text>
<rect class="g" x="400" y="320" width="39.4" height="16" rx="2"/>
<line class="r" x1="436.7" y1="328" x2="455.0" y2="328"/>
<text x="461.0" y="332">183 ms [171, 255]</text>
<text x="16" y="362">QUIC, a new connection and the rest (Cesia)</text>
<rect class="g" x="400" y="350" width="47.8" height="16" rx="2"/>
<line class="r" x1="445.0" y1="358" x2="515.6" y2="358"/>
<text x="521.6" y="362">222 ms [209, 536]</text>
<text x="16" y="392">TCP, a new connection and the rest (Cesia)</text>
<rect class="g" x="400" y="380" width="49.7" height="16" rx="2"/>
<line class="r" x1="446.8" y1="388" x2="450.3" y2="388"/>
<text x="456.3" y="392">231 ms [217, 234]</text>
<text class="s" x="16" y="432">QUIC with migration keeps its connection; the others open a new one and ask for the rest, as Centauri’s resume does.</text>
</svg>
