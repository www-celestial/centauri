[project]
name = "centauri"
cesia = "1.3"

# Centauri stands on Cepheus: its Cesia package, and its engine, which reaches a Cepheus server or forks a database in
# memory. tools/deps.sh puts them in deps/ until Cepheus has a tagged release.
[deps.cepheus]
from = "github.com/www-celestial/cepheus"
version = "v0.1.0"
take = ["cesia/cepheus"]

# The tests run whole apps in memory, on forks of Cepheus's Empty: no server, no network. libsodium hashes the
# passwords and makes the secrets of the sessions.
[test]
allow = ["native=cepheus", "ffi=sodium"]
timeout = "60"

# cesia doc --site: the site of Centauri, its book and the reference of its packages.
[site]
title = "Centauri"
source = "https://github.com/www-celestial/centauri/blob/main/"
color = "#a61e4d"
