[project]
name = "invoices"
cesia = "1.3"

# Centauri and Cepheus, put in deps/ by Centauri's tools/deps.sh examples/invoices until they have tagged releases.
[deps.centauri]
from = "github.com/www-celestial/centauri"
version = "v0.1.0"
take = ["src/app", "src/api", "src/auth", "src/apptest", "src/jobs", "src/mail", "src/hooks", "src/admin", "src/i18n", "src/flags", "src/gen", "tools"]

[deps.ceres]
from = "github.com/www-celestial/ceres"
version = "v0.1.0"
take = ["src/web", "src/browser", "src/form", "web"]

[deps.cepheus]
from = "github.com/www-celestial/cepheus"
version = "v0.1.0"
take = ["cesia/cepheus"]

# The server: the engine of Cepheus, libsodium for the passwords and the sessions, OpenSSL for https, its settings
# (each APP_ variable that Centauri and the app read) and its port.
[tasks.serve]
file = "src/main.ce"
allow = ["native=cepheus", "ffi=sodium", "ffi=ssl", "ffi=crypto", "env", "net", "read=/etc/invoices", "read=/usr/share/zoneinfo", "write=/var/lib/invoices/mail"]

# APP_ADMIN_EMAIL=... APP_ADMIN_PASSWORD=... cesia do admin: a super-admin of the platform.
[tasks.admin]
file = "src/admin.ce"
allow = ["native=cepheus", "ffi=sodium", "env", "net"]

# The tests run whole apps in memory, on forks of Cepheus's Empty: no server, no network.
[test]
allow = ["native=cepheus", "ffi=sodium", "read=.cesia", "write=.cesia", "read=/usr/share/zoneinfo", "ffi=ssl", "ffi=crypto", "net=own", "exec=openssl"]
timeout = "120"

# The invoices and their admin pages on a database in memory filled with a month of data, at http://127.0.0.1:8090/admin
# (PORT for another port): super@app.test, "correct horse super". cesia build --target wasm admin/page.ce first.
[tasks.admin-serve]
file = "tools/admin-serve.ce"
allow = ["native=cepheus", "ffi=sodium", "ffi=ssl", "ffi=crypto", "env", "net", "read", "read=/usr/share/zoneinfo"]

# The test of the admin pages in Chrome without a window (CHROME, a Chrome or a chrome-headless-shell), driven by its
# DevTools protocol: pictures of each page in OUT (shots/). cesia build --target wasm admin/page.ce first.
[tasks.admin-shot]
file = "tools/admin-shot.ce"
allow = ["native=cepheus", "ffi=sodium", "ffi=ssl", "ffi=crypto", "env", "net", "read", "write", "exec", "read=/usr/share/zoneinfo"]
