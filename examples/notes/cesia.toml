[project]
name = "notes"
cesia = "1.3"

# The smallest app of Centauri, the one of its README: notes, each of its tenant.
[deps.centauri]
from = "github.com/www-celestial/centauri"
version = "v0.1.0"
take = ["src/app", "src/api", "src/auth", "src/apptest", "src/jobs", "src/mail", "src/hooks", "src/i18n", "src/flags", "src/gen", "tools"]

[deps.cepheus]
from = "github.com/www-celestial/cepheus"
version = "v0.1.0"
take = ["cesia/cepheus"]

[tasks.serve]
file = "src/main.ce"
allow = ["native=cepheus", "ffi=sodium", "env", "net"]

# cesia do new-module NAME: a new module of the app and its test (Centauri's generator).
[tasks.new-module]
file = "deps/www-celestial/centauri/tools/new-module.ce"
allow = ["read", "write"]

[test]
allow = ["native=cepheus", "ffi=sodium", "read=.cesia", "write=.cesia"]
timeout = "120"
