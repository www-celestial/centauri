[project]
name = "notes"
cesia = "1.3"

# The smallest app of Centauri, the one of its README: notes, each of its tenant.
[deps.centauri]
from = "github.com/www-celestial/centauri"
version = "v0.1.0"
take = ["src/app", "src/api", "src/auth", "src/apptest", "src/jobs", "src/mail"]

[deps.cepheus]
from = "github.com/www-celestial/cepheus"
version = "v0.1.0"
take = ["cesia/cepheus"]

[tasks.serve]
file = "src/main.ce"
allow = ["native=cepheus", "ffi=sodium", "env", "net"]

[test]
allow = ["native=cepheus", "ffi=sodium", "read=.cesia", "write=.cesia"]
timeout = "120"
